name: Shiping Mahjong engine and browser tests
on:
  push:
    branches: [shiping-mahjong]
    paths:
      - "shiping-mahjong/**"
      - ".github/workflows/shiping-mahjong-ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run rule-engine and gameplay tests
        working-directory: shiping-mahjong
        run: npm test
      - name: Install Chromium for browser test
        working-directory: shiping-mahjong
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        working-directory: shiping-mahjong
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/shiping-mahjong-server.log 2>&1 &
      - name: Test actual browser interaction
        working-directory: shiping-mahjong
        run: node tests/browser-smoke.cjs
