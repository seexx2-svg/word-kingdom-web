  <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a86c8"/><stop offset="1" stop-color="#123356"/></linearGradient>
  <clipPath id="circle"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
